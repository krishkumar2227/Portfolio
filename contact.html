<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Krish Kumar through the accessible portfolio contact form.">

    <meta name="author" content="Krish Kumar">

    <meta name="robots" content="index, follow">

    <title>Contact | Krish Kumar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<a class="skip-link" href="#main-content">
    Skip to main content
</a>

<header class="site-header">
    <div class="container">

        <a href="index.html"
           class="logo"
           aria-label="Krish Kumar Home">
            Krish Kumar
        </a>

        <nav aria-label="Primary navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>

    </div>
</header>

<main id="main-content">

    <div class="container">

        <header>
            <h1>Contact Me</h1>

            <p>
                Have a question or want to discuss a project?
                Send me a message.
            </p>
        </header>

        <form action="#" method="post" aria-labelledby="contact-form-title">

            <h2 id="contact-form-title">Contact Form</h2>

            <div class="form-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                    aria-required="true"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    aria-required="true"
                    aria-describedby="email-help"
                >

                <p id="email-help">
                    Enter a valid email address so I can reply to you.
                </p>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    required
                    aria-required="true"
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                    aria-required="true"
                ></textarea>
            </div>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</main>

<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 Krish Kumar.</p>
    </div>
</footer>

</body>
</html>
